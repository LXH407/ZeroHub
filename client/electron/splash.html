<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob: mediastream:; media-src 'self' blob: data:;">
  <title>ZeroHub</title>
  <style>
    html,body{margin:0;padding:0;height:100%;width:100%;background:#ffffff;overflow:hidden;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
    .wrap{height:100%;width:100%;background:#ffffff;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,0.12);display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden;}
    .video-wrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fafbff 0%,#ffffff 100%);padding-top:24px;}
    .logo-video{width:60%;max-width:260px;height:auto;border-radius:20px;box-shadow:0 8px 28px rgba(102,126,234,0.18);}
    .brand{font-size:26px;font-weight:800;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px;margin-top:12px;}
    .sub{margin-top:4px;color:#909399;font-size:12px;letter-spacing:1px;}
    .loader{margin:22px auto 26px;width:200px;height:4px;background:#eef0f3;border-radius:2px;overflow:hidden;position:relative;}
    .loader-bar{position:absolute;left:0;top:0;height:100%;width:38%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:2px;animation:slide 1.1s infinite ease-in-out;}
    .hint{margin-bottom:26px;color:#c0c4cc;font-size:12px;letter-spacing:1px;}
    @keyframes slide{0%{left:-38%;}100%{left:100%;}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="video-wrap">
      <video class="logo-video" src="assets/loading.mp4" autoplay muted loop playsinline disablepictureinpicture></video>
    </div>
    <div class="brand">ZeroHub</div>
    <div class="sub">软件商城 · 大模型 · 游戏 · API中转站</div>
    <div class="loader"><div class="loader-bar"></div></div>
    <div class="hint">正在加载，请稍候...</div>
  </div>
</body>
</html>
